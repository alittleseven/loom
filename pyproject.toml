[project]
name = "loom"
version = "0.0.1"
description = "织机 Loom —— 中文网文 AI 写作工具（loom-1 书仓格式的参考实现）"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "pydantic>=2.7",
    "GitPython>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
loom = "loom.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# cache 重建 / doctor orphan 扫描对不可控源文件做容错跳过（fail-safe，doctor 出报告）
"loom/core/cache.py" = ["BLE001", "S112"]
"loom/core/doctor/doctor.py" = ["BLE001"]
"loom/core/checks/checks.py" = ["BLE001", "S112"]
"loom/planning.py" = ["BLE001"]
# 表驱动测试惯用 dict(**patch) 组装用例
"tests/*" = ["C408"]
